<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MG Potdar Jewellers - Loading</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f8f4e5;
      color: #333;
      text-align: center;
    }
    
    .container {
      padding: 2rem;
    }
    
    .logo {
      width: 180px;
      height: 180px;
      margin-bottom: 2rem;
      background-color: #eee0c9;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      font-weight: bold;
      color: #946e2f;
      margin-left: auto;
      margin-right: auto;
    }
    
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: #5f4c27;
    }
    
    p {
      font-size: 1rem;
      margin-bottom: 2rem;
      color: #666;
      max-width: 500px;
    }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 1rem;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(148, 110, 47, 0.2);
      border-radius: 50%;
      border-top-color: #946e2f;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">MG</div>
    <h1>MG Potdar Jewellers</h1>
    <p>Starting the application. Please wait...</p>
    <div class="loading">
      <div class="loading-spinner"></div>
    </div>
  </div>
</body>
</html>
